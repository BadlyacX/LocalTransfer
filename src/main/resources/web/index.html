<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LocalTransfer</title>
    <style>
        :root {
            --bg: #f4f5f7;
            --card: #fff;
            --fg: #1c1e21;
            --muted: #6b7280;
            --accent: #2563eb;
            --on-accent: #fff;
            --ok: #16a34a;
            --err: #dc2626;
            --line: #e5e7eb
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #101216;
                --card: #1a1d24;
                --fg: #e8eaed;
                --muted: #9aa0a6;
                --accent: #60a5fa;
                --on-accent: #0b1220;
                --line: #2b2f38
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif
        }

        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 16px
        }

        h1 {
            font-size: 20px;
            margin: 8px 0 2px
        }

        .sub {
            color: var(--muted);
            margin: 0 0 16px;
            font-size: 14px
        }

        section {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px
        }

        h2 {
            font-size: 16px;
            margin: 0 0 12px
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        button, label.btn {
            appearance: none;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--fg);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer
        }

        button.primary {
            background: var(--accent);
            color: var(--on-accent);
            border-color: var(--accent);
            font-weight: 600
        }

        button:disabled {
            opacity: .5;
            cursor: default
        }

        input[type=file] {
            display: none
        }

        ul {
            list-style: none;
            margin: 12px 0 0;
            padding: 0
        }

        li {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 0;
            border-top: 1px solid var(--line);
            font-size: 14px;
            word-break: break-all
        }

        li:first-child {
            border-top: 0
        }

        li span.size {
            color: var(--muted);
            white-space: nowrap
        }

        a.dl {
            color: var(--accent);
            text-decoration: none
        }

        .bar {
            height: 8px;
            background: var(--line);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 12px;
            display: none
        }

        .bar > div {
            height: 100%;
            width: 0;
            background: var(--accent);
            transition: width .15s
        }

        #status {
            margin-top: 8px;
            font-size: 14px;
            color: var(--muted);
            min-height: 1.4em
        }

        #status.ok {
            color: var(--ok)
        }

        #status.err {
            color: var(--err)
        }

        .muted {
            color: var(--muted);
            font-size: 14px
        }
    </style>
</head>
<body>
<main>
    <h1>LocalTransfer</h1>
    <p class="sub">已連線到 <b id="dev">…</b></p>

    <section>
        <h2>傳送到電腦</h2>
        <div class="row">
            <label class="btn" for="pickFiles">選擇檔案</label>
            <label class="btn" for="pickDir">選擇資料夾</label>
            <input id="pickFiles" type="file" multiple>
            <input id="pickDir" type="file" webkitdirectory>
        </div>
        <ul id="picked"></ul>
        <div class="row" style="margin-top:12px">
            <button id="send" class="primary" disabled>傳送</button>
            <button id="clear" disabled>清除</button>
        </div>
        <div class="bar" id="bar">
            <div></div>
        </div>
        <div id="status"></div>
    </section>

    <section>
        <h2>電腦分享給我的檔案</h2>
        <div id="sharedHint" class="muted"></div>
        <ul id="shared"></ul>
        <div class="row" style="margin-top:12px">
            <button id="refresh">重新整理</button>
        </div>
    </section>
</main>

<script>
    const $ = s => document.querySelector(s);
    const token = new URLSearchParams(location.search).get('t') || '';
    let picked = [];
    let busy = false;

    function fmt(n) {
        if (n < 1024) return n + ' B';
        const u = ['KB', 'MB', 'GB', 'TB'];
        let i = -1;
        do {
            n /= 1024;
            i++;
        } while (n >= 1024 && i < u.length - 1);
        return n.toFixed(1) + ' ' + u[i];
    }

    function status(msg, cls) {
        const s = $('#status');
        s.textContent = msg;
        s.className = cls || '';
    }

    function label() {
        const ua = navigator.userAgent;
        if (/iPhone/.test(ua)) return 'iPhone';
        if (/iPad/.test(ua)) return 'iPad';
        if (/Android/.test(ua)) return 'Android 手機';
        return '網頁瀏覽器';
    }

    fetch('/api/info').then(r => r.json()).then(i => {
        $('#dev').textContent = i.name;
    }).catch(() => {
    });

    function renderPicked() {
        const ul = $('#picked');
        ul.textContent = '';
        const shown = picked.slice(0, 50);
        for (const f of shown) {
            const li = document.createElement('li');
            const n = document.createElement('span');
            n.textContent = f.webkitRelativePath || f.name;
            const s = document.createElement('span');
            s.className = 'size';
            s.textContent = fmt(f.size);
            li.append(n, s);
            ul.append(li);
        }
        if (picked.length > shown.length) {
            const li = document.createElement('li');
            li.textContent = '…還有 ' + (picked.length - shown.length) + ' 個檔案';
            ul.append(li);
        }
        $('#send').disabled = busy || !picked.length;
        $('#clear').disabled = busy || !picked.length;
    }

    function addFiles(list) {
        picked.push(...list);
        renderPicked();
    }

    $('#pickFiles').onchange = e => {
        addFiles([...e.target.files]);
        e.target.value = '';
    };
    $('#pickDir').onchange = e => {
        addFiles([...e.target.files]);
        e.target.value = '';
    };
    $('#clear').onclick = () => {
        picked = [];
        $('#bar').style.display = 'none';
        status('');
        renderPicked();
    };

    function putChunk(tid, fi, ci, blob, onprogress) {
        return new Promise((resolve, reject) => {
            const x = new XMLHttpRequest();
            x.open('PUT', '/api/chunk/' + tid + '/' + fi + '/' + ci);
            x.upload.onprogress = e => onprogress(e.loaded);
            x.onload = () => x.status === 200 ? resolve() : reject(new Error(x.responseText || ('HTTP ' + x.status)));
            x.onerror = () => reject(new Error('連線中斷'));
            x.send(blob);
        });
    }

    async function putChunkRetry(tid, fi, ci, blob, onprogress) {
        for (let attempt = 1; ; attempt++) {
            try {
                return await putChunk(tid, fi, ci, blob, onprogress);
            } catch (e) {
                onprogress(0);
                if (attempt >= 4 || e.message.startsWith('SHA-256')) throw e;
                await new Promise(r => setTimeout(r, 1000 * attempt));
            }
        }
    }

    function hasChunk(resume, fi, ci) {
        const b64 = resume && resume[fi];
        if (!b64) return false;
        try {
            const bytes = atob(b64);
            return (ci >> 3) < bytes.length && (bytes.charCodeAt(ci >> 3) & (1 << (ci & 7))) !== 0;
        } catch (e) {
            return false;
        }
    }

    $('#send').onclick = async () => {
        if (busy || !picked.length) return;
        busy = true;
        renderPicked();
        const files = picked.slice();
        const total = files.reduce((a, f) => a + f.size, 0);
        const bar = $('#bar'), fill = bar.firstElementChild;
        bar.style.display = 'block';
        fill.style.width = '0';
        status('等待電腦端按下「接受」…');
        try {
            const res = await fetch('/api/offer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sender: label(),
                    files: files.map(f => ({path: f.webkitRelativePath || f.name, size: f.size, sha256: null}))
                })
            });
            if (!res.ok) throw new Error(await res.text());
            const offer = await res.json();
            if (!offer.accepted) {
                status('電腦端拒絕了這次傳送', 'err');
                return;
            }
            const chunkSize = offer.chunkSize;
            if (!chunkSize) throw new Error('電腦端版本過舊，不支援分塊上傳');

            const queue = [];
            let confirmed = 0;
            for (let fi = 0; fi < files.length; fi++) {
                const size = files[fi].size;
                for (let ci = 0, off = 0; off < size; ci++, off += chunkSize) {
                    const len = Math.min(chunkSize, size - off);
                    if (hasChunk(offer.resume, fi, ci)) confirmed += len;
                    else queue.push({fi, ci, off, len});
                }
            }
            const inflight = new Map();
            const redraw = () => {
                let cur = confirmed;
                for (const v of inflight.values()) cur += v;
                fill.style.width = (total ? Math.min(100, cur / total * 100) : 100) + '%';
            };
            let finishedChunks = 0;
            const totalChunks = queue.length;
            let next = 0;
            let failure = null;
            const worker = async () => {
                while (!failure && next < queue.length) {
                    const job = queue[next++];
                    const f = files[job.fi];
                    status('傳送中（' + (finishedChunks + 1) + '/' + totalChunks + ' 塊）：' + f.name);
                    try {
                        await putChunkRetry(offer.transferId, job.fi, job.ci, f.slice(job.off, job.off + job.len), loaded => {
                            inflight.set(job, loaded);
                            redraw();
                        });
                    } catch (e) {
                        failure = failure || e;
                        return;
                    }
                    inflight.delete(job);
                    confirmed += job.len;
                    finishedChunks++;
                    redraw();
                }
            };
            await Promise.all([worker(), worker(), worker()]);
            if (failure) throw failure;
            fill.style.width = '100%';
            status('傳送完成（' + files.length + ' 個檔案，' + fmt(total) + '）', 'ok');
            picked = [];
        } catch (e) {
            status('失敗：' + e.message, 'err');
        } finally {
            busy = false;
            renderPicked();
        }
    };

    async function loadShared() {
        const ul = $('#shared'), hint = $('#sharedHint');
        ul.textContent = '';
        hint.textContent = '';
        if (!token) {
            hint.textContent = '請用電腦端顯示的 QR Code 開啟此頁，才能看到電腦分享的檔案。';
            return;
        }
        try {
            const r = await fetch('/api/shared?t=' + encodeURIComponent(token));
            if (!r.ok) {
                hint.textContent = '無法取得分享清單（連結已失效，請重新掃描 QR Code）。';
                return;
            }
            const items = await r.json();
            if (!items.length) {
                hint.textContent = '目前電腦沒有分享任何檔案。';
                return;
            }
            for (const it of items) {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.className = 'dl';
                a.href = '/api/shared/' + encodeURIComponent(it.id) + '?t=' + encodeURIComponent(token);
                a.textContent = it.name;
                const s = document.createElement('span');
                s.className = 'size';
                s.textContent = fmt(it.size);
                li.append(a, s);
                ul.append(li);
            }
        } catch (e) {
            hint.textContent = '讀取失敗：' + e.message;
        }
    }

    $('#refresh').onclick = loadShared;
    loadShared();
    // PC pushes a "refresh" event when it shares/clears files
    if (token && window.EventSource) {
        const es = new EventSource('/api/events?t=' + encodeURIComponent(token));
        es.addEventListener('refresh', loadShared);
    }
    renderPicked();
</script>
</body>
</html>
