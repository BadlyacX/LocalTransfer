name: Release

on:
  push:
    tags:
      - 'localtransfer-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check tag matches pom version
        run: |
          pom=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          tag="${GITHUB_REF_NAME#localtransfer-}"
          if [ "$pom" != "$tag" ]; then
            echo "Tag version ($tag) does not match pom.xml version ($pom)"
            exit 1
          fi

      - name: Build
        run: mvn -B package

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/LocalTransfer.jar \
            --title "$GITHUB_REF_NAME" --generate-notes
